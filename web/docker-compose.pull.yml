# 免构建部署：直接拉取 Docker Hub 上的预构建镜像
# 用法（NAS / 任意装 Docker 的设备）：
#   docker compose -f docker-compose.pull.yml up -d
# 或把本文件内容粘贴到 Docker 应用的 Compose 里直接部署。
#
# 说明：使用 host 网络模式 —— 服务需要访问内网的爱快路由器，
# 默认 bridge 模式在部分 NAS 上无法转发到局域网 IP，故必须用 host。
# host 模式下不能用 ports 映射，端口改用 PORT 环境变量配置（默认 8000）。
services:
  aikuaidhcp:
    image: dehua/aikuaidhcp:latest
    container_name: aikuaidhcp
    network_mode: host
    environment:
      - PORT=8000
    volumes:
      - ./data:/data
    restart: unless-stopped
